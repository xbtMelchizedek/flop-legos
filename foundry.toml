[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/", "solady/=lib/solady/src/"]

[fuzz]
runs = 512

# Handlers never revert (morpho-blue / yearn shape), so any revert is a bug.
[invariant]
runs = 256
depth = 64
fail_on_revert = true

# Locally: FOUNDRY_PROFILE=ci forge test
[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 1000
depth = 64
fail_on_revert = true

[fmt]
line_length = 120

[lint]
lint_on_build = false
