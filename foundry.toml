[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
# Cancun (TSTORE, MCOPY, PUSH0). Robinhood Chain publishes no hardfork list; Cancun on ArbOS >= 20 comes from
# Arbitrum's docs. See docs/ROBINHOOD_CHAIN.md.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Deploy and smoke scripts read and write deployments/ only.
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = ["forge-std/=lib/forge-std/src/", "solady/=lib/solady/src/"]

[fuzz]
runs = 512

# Handlers never revert (morpho-blue / yearn shape), so any revert is a bug.
[invariant]
runs = 256
depth = 64
fail_on_revert = true

# Locally: FOUNDRY_PROFILE=ci forge test
[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 1000
depth = 64
fail_on_revert = true

[fmt]
line_length = 120

[lint]
lint_on_build = false

# Public, rate-limited, not for production (docs.robinhood.com/chain/connecting). Testnet only; no mainnet entry on purpose.
[rpc_endpoints]
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
